[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "financial-time-series-platform"
version = "0.1.0"
description = "Research foundation for a financial time series prediction platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "yfinance>=0.2,<1",
    "pandera>=0.20,<1",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_time_series"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["docs", ".idea"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
