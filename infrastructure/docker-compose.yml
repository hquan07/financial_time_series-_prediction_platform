name: financial-ts-phase2

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: ./minio
    image: financial-ts-phase2/minio:2025-10-15
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    ports:
      - 127.0.0.1:19000:9000
      - 127.0.0.1:19001:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD-SHELL, 'mc alias set local http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null && mc ready local >/dev/null']
      interval: 3s
      timeout: 5s
      retries: 20

  minio-init:
    image: financial-ts-phase2/minio:2025-10-15
    pull_policy: never
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}"
        "$${MINIO_ROOT_PASSWORD}" >/dev/null &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET in .env}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  minio_data:
